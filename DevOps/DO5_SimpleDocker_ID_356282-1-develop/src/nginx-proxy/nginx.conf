worker_processes  1;
pid                 /tmp/nginx.pid;

events {
    worker_connections  1024;
}

http {
    default_type  application/octet-stream;
    sendfile      on;
    access_log    /dev/stdout;
    error_log     /dev/stderr;

    server {
        listen       8080;
        server_name  localhost;

        location / {
            proxy_pass       http://app:81;
            proxy_set_header Host $host;
        }
    }
}
