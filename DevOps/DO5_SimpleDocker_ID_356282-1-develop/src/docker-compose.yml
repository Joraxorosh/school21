services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ./nginx:/etc/nginx
    networks:
      - internal

  proxy:
    image: nginxinc/nginx-unprivileged:1.27-bookworm
    volumes:
      - ./nginx-proxy/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:8080"
    depends_on:
      - app
    networks:
      - internal

networks:
  internal:
    driver: bridge
