stages:
  - build
  - codestyle
  - test
  - deploy

variables:
  CAT_DIR: src/cat
  GREP_DIR: src/grep

build_cat:
  stage: build
  script:
    - make -C ${CAT_DIR}
  artifacts:
    paths:
      - ${CAT_DIR}/s21_cat
    expire_in: 30 days

build_grep:
  stage: build
  script:
    - make -C ${GREP_DIR}
  artifacts:
    paths:
      - ${GREP_DIR}/s21_grep
    expire_in: 30 days

codestyle:
  stage: codestyle
  needs: []
  script:
    - |
      STATUS=0
      for f in $(find src -name '*.c' -o -name '*.h'); do
        echo "== clang-format: ${f} =="
        if ! diff -u "${f}" <(clang-format -style=file "${f}"); then
          STATUS=1
        fi
      done
      exit ${STATUS}

integration_test:
  stage: test
  needs: ["build_cat", "build_grep", "codestyle"]
  script:
    - chmod +x ${CAT_DIR}/test_cat.sh ${GREP_DIR}/test_grep.sh
    - |
      echo "== cat integration tests =="
      (cd ${CAT_DIR} && ./test_cat.sh)
      CAT_STATUS=$?
      echo "== grep integration tests =="
      (cd ${GREP_DIR} && ./test_grep.sh)
      GREP_STATUS=$?
      if [ ${CAT_STATUS} -eq 0 ] && [ ${GREP_STATUS} -eq 0 ]; then
        echo "INTEGRATION TESTS: PASSED"
      else
        echo "INTEGRATION TESTS: FAILED"
        exit 1
      fi
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - ${CAT_DIR}/log.txt
      - ${GREP_DIR}/log.txt

deploy:
  stage: deploy
  needs: ["build_cat", "build_grep", "integration_test"]
  when: manual
  script:
    - bash src/scripts/deploy.sh ${CAT_DIR}/s21_cat ${GREP_DIR}/s21_grep
